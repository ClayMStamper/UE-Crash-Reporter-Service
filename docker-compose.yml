services:
  crash-reporter:
    build: .
    container_name: ue-crash-reporter
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - crash_data:/data
    environment:
      ADDR: ":8080"
      DATA_DIR: "/data"
      DB_PATH: "/data/crashes.db"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  crash_data:
    driver: local
